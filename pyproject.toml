[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-tree-table-analysis"
version = "1.0.1"
description = "Table-only analysis of literature topic trees, semantic reliability, PMID structures and temporal patterns"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.12,<2", "scikit-learn>=1.5,<2", "igraph>=0.11,<2", "leidenalg>=0.10,<1", "threadpoolctl>=3.1,<4", "openpyxl>=3.1,<4", "openai>=1.40,<3"]

[project.optional-dependencies]
semantic = ["torch>=2.2,<3", "transformers>=4.40,<5", "safetensors>=0.4", "sentencepiece>=0.2"]

[project.scripts]
topic-tree-analysis = "tnbc_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tnbc_analysis*"]
